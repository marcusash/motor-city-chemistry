name: Squad Triage

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.label.name == 'squad'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Triage issue via Lead
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;

            let teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');

            const members = [];
            let inMembersTable = false;
            for (const line of lines) {
              if (line.match(/^##\s+(Members|Team Roster)/i)) {
                inMembersTable = true;
                continue;
              }
              if (inMembersTable && line.startsWith('## ')) break;
              if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                if (cells.length >= 2 && !['Scribe', 'Ralph'].includes(cells[0])) {
                  members.push({
                    name: cells[0],
                    role: cells[1]
                  });
                }
              }
            }

            const lead = members.find(m =>
              m.role.toLowerCase().includes('lead') && m.role.toLowerCase().includes('architect')
            );

            if (!lead) {
              core.warning('No Lead Architect found in team roster');
              return;
            }

            const issueText = `${issue.title}\n${issue.body || ''}`.toLowerCase();
            let assignedMember = null;
            let triageReason = '';

            for (const member of members) {
              const role = member.role.toLowerCase();
              if ((role.includes('security') || role.includes('ops') || role.includes('infra')) &&
                  (issueText.includes('ci') || issueText.includes('runner') ||
                   issueText.includes('deploy') || issueText.includes('infrastructure') ||
                   issueText.includes('script') || issueText.includes('security'))) {
                assignedMember = member;
                triageReason = 'Issue relates to infrastructure/security work';
                break;
              }
              if ((role.includes('design') || role.includes('ui')) &&
                  (issueText.includes('ui') || issueText.includes('design') ||
                   issueText.includes('canvas') || issueText.includes('brand'))) {
                assignedMember = member;
                triageReason = 'Issue relates to design/UI work';
                break;
              }
              if ((role.includes('test') || role.includes('quality') || role.includes('qa')) &&
                  (issueText.includes('test') || issueText.includes('bug') ||
                   issueText.includes('coverage') || issueText.includes('regression'))) {
                assignedMember = member;
                triageReason = 'Issue relates to testing/quality work';
                break;
              }
              if ((role.includes('data') || role.includes('search')) &&
                  (issueText.includes('data') || issueText.includes('search') ||
                   issueText.includes('sentiment') || issueText.includes('index'))) {
                assignedMember = member;
                triageReason = 'Issue relates to data/search work';
                break;
              }
              if ((role.includes('research') || role.includes('prompt') || role.includes('eval')) &&
                  (issueText.includes('prompt') || issueText.includes('eval') ||
                   issueText.includes('voice') || issueText.includes('tone'))) {
                assignedMember = member;
                triageReason = 'Issue relates to research/eval work';
                break;
              }
              if (role.includes('operations') &&
                  (issueText.includes('coordination') || issueText.includes('backlog') ||
                   issueText.includes('sprint') || issueText.includes('comms'))) {
                assignedMember = member;
                triageReason = 'Issue relates to operations/coordination work';
                break;
              }
            }

            if (!assignedMember) {
              assignedMember = lead;
              triageReason = 'No specific domain match, assigned to Lead Architect';
            }

            const assignLabel = `squad:${assignedMember.name.toLowerCase()}`;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [assignLabel]
            });

            const memberList = members.map(m =>
              `- **${m.name}** (${m.role}) \u2192 label: \`squad:${m.name.toLowerCase()}\``
            ).join('\n');

            const comment = [
              `### 🏗️ Squad Triage: ${lead.name} (${lead.role})`,
              '',
              `**Issue:** #${issue.number}: ${issue.title}`,
              `**Assigned to:** ${assignedMember.name} (${assignedMember.role})`,
              `**Reason:** ${triageReason}`,
              '',
              `---`,
              '',
              `**Team roster:**`,
              memberList,
              '',
              `> To reassign, remove the current \`squad:*\` label and add the correct one.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Triaged issue #${issue.number} to ${assignedMember.name} (${assignLabel})`);
